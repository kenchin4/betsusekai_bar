<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>別世界Bar アーカイブ</title>
<meta name="description" content="別世界Bar 2015年の第1回から全回の開催記録。プレゼン・登壇者・オリジナルカレー・告知ポスト。">
<meta property="og:type" content="website">
<meta property="og:title" content="別世界Bar アーカイブ">
<meta property="og:description" content="別世界Bar 2015年の第1回から全回の開催記録。プレゼン・登壇者・オリジナルカレー・告知ポスト。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ink:#070B16;
    --navy:#0F1A33;
    --navy-2:#16244A;
    --amber:#E9A93C;
    --amber-lite:#F6D08A;
    --kinari:#F3ECDC;
    --body:#DCD6C7;
    --muted:#96A0BC;
    --line:rgba(243,236,220,.14);
    --line-strong:rgba(233,169,60,.38);
    --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
    --num:"Oswald","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{
    margin:0;background:var(--ink);color:var(--kinari);
    font-family:var(--jp);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--amber-lite)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
  .wrap{max-width:1040px;margin:0 auto;padding:0 clamp(18px,5vw,40px)}

  /* ---------- top bar ---------- */
  .topbar{border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--navy),var(--ink))}
  .topbar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding:22px 0 20px}
  .mark{font-family:var(--display);font-size:clamp(30px,5.6vw,50px);line-height:1.08;letter-spacing:.03em;text-shadow:0 0 28px rgba(233,169,60,.22)}
  .mark b{color:var(--amber);font-weight:inherit}
  .nav{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
  .nav a{text-decoration:none;border-bottom:1px solid var(--line-strong);padding-bottom:1px}
  .nav a:hover{color:var(--amber)}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;
    background:radial-gradient(80% 70% at 30% 30%,rgba(233,169,60,.10),rgba(233,169,60,0) 62%),
               linear-gradient(180deg,var(--ink),var(--navy) 60%,var(--ink));}
  .hero .wrap{padding:clamp(32px,5vw,54px) 0 clamp(28px,4vw,40px)}
  .doors{display:flex;gap:6px;align-items:flex-end;margin:28px 0 0;flex-wrap:wrap;max-width:560px}
  .mini{position:relative;width:14px;aspect-ratio:3/5;border-radius:7px 7px 1px 1px;
    background:linear-gradient(155deg,#1B2848,#0A1128);border:1px solid rgba(233,169,60,.30)}
  .mini::after{content:"";position:absolute;top:12%;bottom:12%;right:-1px;width:2px;border-radius:2px;
    background:var(--amber-lite);box-shadow:0 0 6px 2px rgba(233,169,60,.45);opacity:.8}
  .mini:nth-child(3n){margin-bottom:4px}.mini:nth-child(5n){margin-bottom:7px}
  .eyebrow{margin:0 0 10px;font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--amber)}
  h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,54px);line-height:1.15;text-wrap:balance;text-shadow:0 0 34px rgba(233,169,60,.22)}
  .lede{margin:16px 0 0;max-width:34em;color:var(--body)}
  .stats{display:flex;flex-wrap:wrap;gap:0;margin:28px 0 0;padding:0;list-style:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stats li{flex:1 1 130px;padding:14px 18px 12px 0;border-right:1px solid var(--line);margin-right:18px}
  .stats li:last-child{border-right:0;margin-right:0}
  .stats .n{display:block;font-family:var(--num);font-size:clamp(28px,4vw,38px);font-weight:600;line-height:1;color:var(--amber-lite);font-variant-numeric:tabular-nums}
  .stats .n small{font-size:.5em;margin-left:3px;color:var(--amber)}
  .stats .l{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-top:6px}

  /* ---------- controls ---------- */
  .controls{position:sticky;top:0;z-index:5;background:rgba(7,11,22,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .controls .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 0}
  .field{display:flex;align-items:center;gap:8px;min-width:0}
  .field label{font-size:12px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
  input[type=search],select{
    font:inherit;font-size:14px;color:var(--kinari);background:var(--navy);
    border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;min-height:38px}
  input[type=search]{flex:1 1 220px;min-width:180px}
  input[type=search]::placeholder{color:var(--muted)}
  select{padding-right:28px;appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--amber) 50%),linear-gradient(135deg,var(--amber) 50%,transparent 50%);
    background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .search{flex:1 1 240px}
  .count{font-family:var(--num);font-size:14px;letter-spacing:.06em;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .count b{color:var(--amber-lite);font-weight:600}
  .reset{font:inherit;font-size:13px;color:var(--amber-lite);background:none;border:1px solid var(--line-strong);border-radius:999px;padding:5px 13px;cursor:pointer}
  .reset:hover{background:rgba(233,169,60,.12)}

  /* ---------- year jump ---------- */
  .years{display:flex;flex-wrap:wrap;gap:6px;padding:18px 0 4px;margin:0;list-style:none}
  .years a{font-family:var(--num);font-size:13px;letter-spacing:.06em;text-decoration:none;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:999px}
  .years a:hover{color:var(--amber-lite);border-color:var(--line-strong)}
  .years a.off{opacity:.3;pointer-events:none}

  /* ---------- list ---------- */
  .list{padding:8px 0 40px}
  .year{padding:34px 0 8px;border-bottom:2px solid var(--line-strong);margin-bottom:6px;
    display:flex;align-items:baseline;gap:14px}
  .year h2{margin:0;font-family:var(--num);font-weight:600;font-size:clamp(30px,4.6vw,42px);letter-spacing:.04em;line-height:1;color:var(--amber)}
  .year span{font-size:13px;color:var(--muted);letter-spacing:.06em}
  .ev{display:grid;grid-template-columns:132px 1fr;gap:clamp(14px,2.6vw,30px);padding:26px 0;border-bottom:1px solid var(--line);scroll-margin-top:80px}
  .ev:target{background:linear-gradient(90deg,rgba(233,169,60,.08),transparent 60%)}
  .no{font-family:var(--num);line-height:1}
  .no .k{display:block;font-size:12px;letter-spacing:.2em;color:var(--amber);font-weight:600}
  .no .v{display:block;font-size:44px;font-weight:600;color:var(--kinari);font-variant-numeric:tabular-nums;margin-top:2px}
  .no .v.sp{font-size:22px;line-height:1.2;margin-top:8px;color:var(--amber-lite)}
  .no time{display:block;margin-top:10px;font-size:15px;letter-spacing:.06em;color:var(--body);font-variant-numeric:tabular-nums}
  .no .dow{color:var(--muted);font-size:12px;margin-left:3px}
  .meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 12px;padding:0;list-style:none}
  .chip{font-size:12px;letter-spacing:.04em;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--body);line-height:1.6}
  .chip.venue{border-color:var(--line-strong);color:var(--amber-lite)}
  .chip.online{border-style:dashed}
  .chip.special{background:rgba(233,169,60,.14);border-color:var(--line-strong);color:var(--amber-lite)}
  .prog{margin:0;padding:0;list-style:none;display:grid;gap:8px}
  .prog li{display:grid;grid-template-columns:1.6em 1fr;gap:6px;align-items:baseline}
  .prog .c{font-family:var(--num);font-size:13px;color:var(--amber);font-weight:600;letter-spacing:.04em;padding-top:2px}
  .prog .t{font-size:17px;font-weight:700;line-height:1.5;color:var(--kinari)}
  .prog .by{display:block;font-size:14px;color:var(--muted);font-weight:400;margin-top:1px}
  .prog .by::before{content:"— ";color:var(--line-strong)}
  .prog.free .t{font-weight:500;font-size:15.5px;color:var(--body)}
  .note{margin:10px 0 0;font-size:14px;color:var(--muted)}
  .curry{display:flex;gap:10px;align-items:baseline;margin:14px 0 0;font-size:14.5px;color:var(--body);padding:8px 12px;
    border-left:3px solid var(--amber);background:rgba(233,169,60,.06);border-radius:0 6px 6px 0}
  .curry .k{font-family:var(--num);font-size:11px;letter-spacing:.2em;color:var(--amber);white-space:nowrap;font-weight:600;text-transform:uppercase}
  .curry.off{border-left-color:var(--line);background:transparent;color:var(--muted)}
  .links{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:0;list-style:none}
  .links a{display:inline-block;font-size:12.5px;text-decoration:none;padding:4px 12px;border-radius:999px;border:1px solid var(--line-strong);color:var(--amber-lite)}
  .links a:hover{background:rgba(233,169,60,.12)}
  .links a.sub{border-color:var(--line);color:var(--body)}
  .empty{padding:48px 0;color:var(--muted);text-align:center}
  .empty b{display:block;color:var(--kinari);font-size:18px;margin-bottom:6px}

  footer{padding:30px 0 50px;color:var(--muted);font-size:13px;line-height:1.9;border-top:1px solid var(--line)}
  footer a{color:var(--amber-lite)}

  @media (max-width:640px){
    .ev{grid-template-columns:1fr;gap:10px;padding:22px 0}
    .no{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
    .no .k{display:none}
    .no .v{font-size:30px;margin:0}
    .no .v::before{content:"第";font-size:13px;margin-right:2px;color:var(--amber)}
    .no .v::after{content:"回";font-size:13px;margin-left:2px;color:var(--amber)}
    .no .v.sp{font-size:18px}
    .no .v.sp::before,.no .v.sp::after{content:none}
    .no time{margin:0}
    .stats li{flex:1 1 38%;padding-right:12px;margin-right:12px}
    .stats li:nth-child(2n){border-right:0;margin-right:0}
    .count{margin-left:0;width:100%}
  }
</style>
</head>

    <div class="field"><label for="year">年</label><select id="year"><option value="">すべて</option></select></div>
    <div class="field"><label for="venue">会場</label><select id="venue"><option value="">すべて</option></select></div>

      <option value="online">配信のみ</option>
      <option value="special">周年・スペシャル</option>
    </select></div>

    <button class="reset" id="reset" type="button" hidden>条件をクリア</button>
  </div>
</div>

<div class="wrap">
  <ul class="years" id="years"></ul>
  <div class="list" id="list"></div>
  <footer>
    別世界Bar｜珍スポ・団地・廃墟——新しい趣味の扉を開けるトークイベント（大阪）。<br>
    記録はクルーの控えをもとにしています。抜けや誤りがあれば、<a href="https://x.com/kenchin" target="_blank" rel="noopener">@kenchin</a> までそっと教えてください。
  </footer>
</div>

/* ---------- 以下、表示ロジック（通常は触らない） ---------- */
(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CIRC="①②③④⑤⑥⑦⑧⑨⑩";
  const DOW="日月火水木金土";
  const CAT={venue:"現地",hybrid:"配信＋現地",online:"配信のみ",special:"スペシャル"};
  const events=EVENTS.slice().sort((a,b)=>(b.date.localeCompare(a.date))||((b.no||0)-(a.no||0)));

  /* 扉の列 = 開催回数ぶん */
  const doors=$("#doors");
  const numbered=events.filter(e=>e.no!=null);
  doors.innerHTML=numbered.map(()=>'<span class="mini"></span>').join("");

  /* 統計 */
  const first=events[events.length-1], latest=events[0];
  const progCount=events.reduce((n,e)=>n+e.programs.filter(p=>p.title).length,0);
  const curryCount=events.filter(e=>e.curry&&!e.curry.startsWith("※")&&e.curry!=="なし").length;
  const presenters=new Set();
  events.forEach(e=>e.programs.forEach(p=>p.by&&presenters.add(p.by)));
  const years=(new Date(latest.date)-new Date(first.date))/31557600000;
  $("#stats").innerHTML=[
    ["開催回数",Math.max(...numbered.map(e=>e.no)),"回"],
    ["続けて",Math.floor(years),"年"],
    ["プレゼン",progCount,"本"],
    ["オリジナルカレー",curryCount,"皿"],
  ].map(([l,n,u])=>`<li><span class="n">${n}<small>${u}</small></span><span class="l">${l}</span></li>`).join("");

  /* セレクト */
  const yearSel=$("#year"), venueSel=$("#venue"), catSel=$("#cat"), q=$("#q"), reset=$("#reset");
  const yearList=[...new Set(events.map(e=>e.date.slice(0,4)))];
  yearList.forEach(y=>yearSel.insertAdjacentHTML("beforeend",`<option value="${y}">${y}年</option>`));
  const venueCount={};events.forEach(e=>venueCount[e.venue]=(venueCount[e.venue]||0)+1);
  Object.keys(venueCount).sort((a,b)=>venueCount[b]-venueCount[a]).forEach(v=>venueSel.insertAdjacentHTML("beforeend",`<option value="${esc(v)}">${esc(v)}（${venueCount[v]}）</option>`));
  $("#years").innerHTML=yearList.map(y=>`<li><a href="#y${y}" data-year="${y}">${y}</a></li>`).join("");

  function fmtDate(d){
    const [y,m,dd]=d.split("-").map(Number);
    const dow=DOW[new Date(y,m-1,dd).getDay()];
    return `${y}.${String(m).padStart(2,"0")}.${String(dd).padStart(2,"0")}<span class="dow">(${dow})</span>`;
  }
  function linkLabel(u,i){
    if(/instagram\.com/.test(u)) return "Instagram";
    const m=u.match(/x\.com\/([^/]+)\//);
    return m?`@${m[1]}`:`関連${i+1}`;
  }
  function render(list){
    if(!list.length){$("#list").innerHTML='<div class="empty"><b>該当する回がありません</b>条件を変えて探してみてください。</div>';return;}
    let html="",curYear="";
    list.forEach(e=>{
      const y=e.date.slice(0,4);
      if(y!==curYear){
        curYear=y;
        const n=list.filter(x=>x.date.slice(0,4)===y).length;
        html+=`<div class="year" id="y${y}"><h2>${y}</h2><span>${n}回</span></div>`;
      }
      const free=e.programs.length===1&&!e.programs[0].by&&e.programs[0].title.length>30;
      const progs=e.programs.length?`<ol class="prog${free?" free":""}">${e.programs.map((p,i)=>
        `<li><span class="c">${e.programs.length>1?CIRC[i]||(i+1):"　"}</span><span class="t">${esc(p.title)}${p.by?`<span class="by">${esc(p.by)}</span>`:""}</span></li>`).join("")}</ol>`:"";
      const curry=e.curry?`<p class="curry${e.curry.startsWith("※")?" off":""}"><span class="k">Curry</span><span>${esc(e.curry.replace(/^※/,""))}</span></p>`:"";
      const links=[];
      if(e.post) links.push(`<li><a href="${esc(e.post)}" target="_blank" rel="noopener">告知ポスト</a></li>`);
      (e.links||[]).forEach((u,i)=>links.push(`<li><a class="sub" href="${esc(u)}" target="_blank" rel="noopener">${esc(linkLabel(u,i))}</a></li>`));
      html+=`<article class="ev" id="${e.no!=null?"no"+e.no:"ex"+e.date}">
        <div class="no">${e.no!=null?`<span class="k">VOL.</span><span class="v">${e.no}</span>`:`<span class="k">EXTRA</span><span class="v sp">番外編</span>`}<time datetime="${e.date}">${fmtDate(e.date)}</time></div>
        <div>
          <ul class="meta"><li class="chip venue">${esc(e.venue)}</li><li class="chip ${e.cat}">${esc(e.style)}</li></ul>
          ${progs}
          ${e.note?`<p class="note">${esc(e.note)}</p>`:""}
          ${curry}
          ${links.length?`<ul class="links">${links.join("")}</ul>`:""}
        </div></article>`;
    });
    $("#list").innerHTML=html;
  }
  function norm(s){return String(s||"").toLowerCase().normalize("NFKC");}
  function apply(){
    const kw=norm(q.value).trim().split(/\s+/).filter(Boolean);
    const y=yearSel.value,v=venueSel.value,c=catSel.value;
    const out=events.filter(e=>{
      if(y&&!e.date.startsWith(y))return false;
      if(v&&e.venue!==v)return false;
      if(c&&e.cat!==c)return false;
      if(kw.length){
        const hay=norm([e.venue,e.style,e.note,e.curry,e.date.slice(0,4),e.no!=null?"第"+e.no+"回":"番外編",...e.programs.map(p=>p.title+" "+p.by)].join(" "));
        return kw.every(k=>hay.includes(k));
      }
      return true;
    });
    render(out);
    const active=!!(kw.length||y||v||c);
    $("#count").innerHTML=active?`<b>${out.length}</b> / ${events.length} 回`:`全 <b>${events.length}</b> 回`;
    reset.hidden=!active;
    const shown=new Set(out.map(e=>e.date.slice(0,4)));
    document.querySelectorAll("#years a").forEach(a=>a.classList.toggle("off",!shown.has(a.dataset.year)));
  }
  [q,yearSel,venueSel,catSel].forEach(el=>el.addEventListener("input",apply));
  reset.addEventListener("click",()=>{q.value="";yearSel.value="";venueSel.value="";catSel.value="";apply();q.focus();});
  apply();
  if(location.hash){const t=document.querySelector(location.hash);t&&t.scrollIntoView();}
})();
</script>
</body>
</html>
